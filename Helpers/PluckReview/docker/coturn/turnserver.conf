# Pluck's own TURN relay (coturn). Mounted read-only at /etc/coturn/turnserver.conf.
#
# coturn cannot read environment variables in this file. docker-compose.yml passes the values specific
# to your network as command-line flags (they override this file):
#   --realm=$TURN_REALM   --listening-ip/--relay-ip=$LAN_ADDR
#   --external-ip=$TURN_EXTERNAL_IP/$LAN_ADDR   --allowed-peer-ip=$LAN_ADDR
# The shared secret is NOT a flag (the process list would show it): the container's start command
# appends `static-auth-secret=<content of TURN_SECRET_FILE>` to a private copy of this file in /tmp.
# Everything else is fixed here.

# Time-limited credentials: Pluck's hosts derive them from the shared secret (TURN REST).
use-auth-secret
# static-auth-secret=...   (appended at start from the secret file, see above)
# realm=...                (command line, see above)

listening-port=3478
tls-listening-port=5349
min-port=49160
max-port=49200

# DNS-challenge certificate on a read-only mount (see README.md).
cert=/certs/fullchain.pem
pkey=/certs/privkey.pem

no-cli
no-multicast-peers
no-tlsv1
no-tlsv1_1
fingerprint
stale-nonce=600
user-quota=4
total-quota=40
max-bps=8000000
no-tcp-relay

# Relay to nobody: every IPv4 and IPv6 address is denied, public ones included...
denied-peer-ip=0.0.0.0-255.255.255.255
denied-peer-ip=::-ffff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
# ...except the NAS itself: allowed-peer-ip=$LAN_ADDR comes from the command line and is an exception
# to the denied ranges, so the relay can only reach the host's own address. coturn can't limit the
# port, so every UDP port on that address is reachable through the relay: limit it to the helper's
# WebRTC port with the firewall rule in README.md ("Port scope").

# Logs go to stdout, without user names.
log-file=stdout
simple-log

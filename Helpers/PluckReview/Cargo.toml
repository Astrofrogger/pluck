[package]
name = "pluck-review"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
base64 = "0.22"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
if-addrs = "0.15.0"
rand = "0.9"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde_json = "1"
str0m = { version = "0.25.0", default-features = false }
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "rustls-tls-native-roots"] }

hkdf = "0.12"
hmac = "0.12"
sha2 = "0.10"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
socket2 = "0.6.5"
sha1 = "0.11"
libc = "0.2"
ring = "0.17.14"  # Ed25519 room signing key (protocol 2); already in the tree through rustls

[features]
default = ["apple"]
# macOS: Apple CryptoKit/Security for DTLS. Linux (the NAS container): pure-Rust crypto.
apple = ["str0m/apple-crypto"]
portable = ["str0m/rust-crypto"]


[profile.dist]
inherits = "release"
strip = true
lto = "fat"
codegen-units = 1
panic = "abort"
